<script>
'use strict';
/* ============================================================
   ハンガー投げ（仮） — v25 (instructions 001-034, 025 cancelled)
   Single-file build. All drawing is code-drawn Canvas.
   No external files, no fetch, works on file://.
   Sound: WebAudio synthesis only. Best: localStorage 'hanger-toss-best'.
   ============================================================ */

/* ---------- constants (all provisional, per spec) ---------- */
var CV_W = 960, CV_H = 540;
var VIEW_SCALE = 0.6, WORLD_W = 1600, WORLD_H = 667;
var GRAVITY = 2340, AIR_DRAG = 0.02, RESTITUTION = 0.4, FLOOR_FRICTION = 0.8;
/* v25 (034): the hanger is 0.8x its former size (user decision). ONE constant
   scales every hanger-local length, so the drawn wire, the loop that
   catches, the grip points and the collision samples all match.
   Derived: loop radius 20 x 0.8 = 16, so LOOP_FIT_RADIUS = 16 - ○ radius 4
   = 12; wire half-width 2.5 x 0.8 = 2.0, so CONTACT_DIST = 2.0 + 4 = 6.0;
   HANGER_INERTIA 3600 x 0.8 = 2880 (the bounce lever arms scale 0.8, so
   the bounce-induced spin change stays the same); grip normaliser 78 x
   0.8 = 62.4 (so dNorm, and hence spin, is unchanged for the same
   relative grip). The wire line width scales too: 5 -> 4 (flying),
   6 -> 4.8 (panel) = 2 x WIRE_HALF_WIDTH. */
var HANGER_SCALE = 0.8;
function hs(p) { return { x: p.x * HANGER_SCALE, y: p.y * HANGER_SCALE }; }
var GRIP_NORM = 78 * HANGER_SCALE; /* 62.4: grip-distance normaliser for dNorm */
var LOOP_FIT_RADIUS = 20 * HANGER_SCALE - 4; /* 12 (was 16): loop radius 16 - ○ radius 4 */
var GAP_MIN = 90, GAP_MAX = 164; /* gap sector (local angles, y-down): stem base 90° to hook tip ~164° */
var CONTACT_DIST = 2.5 * HANGER_SCALE + 4, WIRE_HALF_WIDTH = 2.5 * HANGER_SCALE, BOUNCE_E_HOOK = 0, BOUNCE_E_BODY = 0.05, HANGER_INERTIA = 3600 * HANGER_SCALE; /* v25 (034): CONTACT_DIST 6.0 (was 6.5); WIRE_HALF_WIDTH 2.0 (was 2.5); HANGER_INERTIA 2880 (was 3600); per-part bounce unchanged — hook/stem 0, body 0.05 */
/* v20 (026): THREE ○s. Each is {x, y, t, done} in world coords.
   Mutated in place (never reassigned) so the debug hook's reference stays
   live. Initial positions are a representative triangle (P1 t=0.6);
   randomCatchPoint() re-rolls them at every game start / retry.
   v25 (034): the ○s form an equilateral triangle (side 120 screen px),
   P1/P2 on the rod line, P3 off it (up). t is the rod-projection
   parameter (P2 may be past B, so t may exceed 1). */
var CATCH_POINTS = [
  { x: 1250, y: 360, t: 0.6, done: false },
  { x: 1406.17, y: 235.06, t: 0.91235, done: false },
  { x: 1219.88, y: 162.28, t: 0.75617, done: false }
];
var ROD_RADIUS = 4;
var DESPAWN_MIN_X = -150, DESPAWN_MAX_X = 1750, DESPAWN_MIN_Y = -1200; /* v17 (023): top despawn line widened from y=0 to y=-1200 so a strong upward throw arcs above the screen and comes back down (a 100%/80deg throw peaks at world y≈-935 at its highest point, so -1200 always lets it return); left/right lines unchanged */
var CATCH_MAX_SPEED = 1100, SLIP_THRESHOLD = 850, POWER_CHARGE_TIME = 1.2;
/* v26 (035): HANG_HOLD_TIME removed — no 3.0s hang hold any more; a hook resolves at once (see resolveCatch). */
var ROD_A = { x: 950, y: 600 }, ROD_B = { x: 1450, y: 200 };
var HAND = { x: 330, y: 400 };
var FLOOR_Y = 600, STOP_SPEED = 30, VY_NEAR_ZERO = 80;
var SPIN_BASE = 180, SPIN_PER_GRIP = 540;
/* v13 (019): a stopped hanger tips over flat in 0.25s (visual only) */
var SETTLE_TIME = 0.25;
/* v13: the bounce click fires at most once per 60ms per flight — a hook
   resting on the ○ can bounce ~195 times in ~0.5s, which would buzz */
var CLANK_COOLDOWN = 0.06;
/* Hanger model, local coords, origin = COM (world units).
   v25 (034): every value is the v24 value x HANGER_SCALE (0.8) — loop
   centre (0, -49.6), radius 16; tip (-15.36, -45.2); base (0, -33.6);
   top (0, -65.6); apex (0, -9.6); body ±68 x 41.6; overall 136 x 107.2. */
var HOOK_LOOP_CENTER = hs({ x: 0, y: -62 }), HOOK_LOOP_RADIUS = 20 * HANGER_SCALE;
var HOOK_TIP = hs({ x: -19.2, y: -56.5 }), HOOK_BASE = hs({ x: 0, y: -42 });
var HOOK_TOP = hs({ x: 0, y: -82 });
var APEX = hs({ x: 0, y: -12 }), BODY_L = hs({ x: -85, y: 52 }), BODY_R = hs({ x: 85, y: 52 });
var BAR_MID = hs({ x: 0, y: 52 });
/* Layout (screen coords) */
var PANEL_C = { x: 480, y: 88 }, PANEL_SCALE = 0.68; /* v09: 134px-tall hook fits the panel */ /* GRIP panel hanger */
var ANGLE_ORIGIN = { x: 680, y: 115 };               /* bottom-left of angle window */
var ANGLE_GRID = { x0: 680, y0: 35, x1: 840, y1: 115 };
var THROW_BTN = { x: 360, y: 480, w: 240, h: 50 };
var BTN_EN = { x: 700, y: 4, w: 45, h: 22 };
var BTN_HELP = { x: 750, y: 4, w: 35, h: 22 };
var BTN_SND = { x: 790, y: 4, w: 60, h: 22 };
var BTN_PAUSE = { x: 855, y: 4, w: 90, h: 22 };
var BTN_FLIP = { x: 568, y: 110, w: 50, h: 22 }; /* v29 (038): inside the GRIP panel (330-630 x 32-138), bottom-right; was in the title strip in v28 (037) */
var START_BTN = { x: 350, y: 360, w: 260, h: 56 };
var RETRY_BTN = { x: 380, y: 330, w: 200, h: 50 };
var RESUME_BTN = { x: 380, y: 300, w: 200, h: 50 };
var CLOSE_BTN = { x: 430, y: 400, w: 100, h: 40 };

/* ---------- small helpers ---------- */
var D2R = Math.PI / 180, R2D = 180 / Math.PI;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function sub2(a, b) { return { x: a.x - b.x, y: a.y - b.y }; }
function add2(a, b) { return { x: a.x + b.x, y: a.y + b.y }; }
function mul2(a, s) { return { x: a.x * s, y: a.y * s }; }
function dot2(a, b) { return a.x * b.x + a.y * b.y; }
function len2(a) { return Math.hypot(a.x, a.y); }
function norm2(a) { var l = len2(a) || 1; return { x: a.x / l, y: a.y / l }; }
/* rotate a local point by deg (clockwise positive, canvas convention, y down) */
function rotPt(p, deg) {
  var r = deg * D2R, c = Math.cos(r), s = Math.sin(r);
  return { x: p.x * c - p.y * s, y: p.x * s + p.y * c };
}
function normAngle180(deg) {
  var d = ((deg % 360) + 360) % 360;
  return d > 180 ? d - 360 : d;
}
/* distance from point p to segment a-b; returns {d, x, y, t} */
function distPtSeg(p, a, b) {
  var abx = b.x - a.x, aby = b.y - a.y;
  var l2 = abx * abx + aby * aby;
  var t = l2 === 0 ? 0 : ((p.x - a.x) * abx + (p.y - a.y) * aby) / l2;
  t = clamp(t, 0, 1);
  var cx = a.x + abx * t, cy = a.y + aby * t;
  return { d: Math.hypot(p.x - cx, p.y - cy), x: cx, y: cy, t: t };
}
/* world -> screen */
function w2sx(wx) { return wx * VIEW_SCALE; }
function w2sy(wy) { return 140 + wy * VIEW_SCALE; }
function w2s(p) { return { x: w2sx(p.x), y: w2sy(p.y) }; }
function hitRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }

/* rod direction / upper normal (spec: n_up approx (-0.63, -0.78)) */
var ROD_U = norm2(sub2(ROD_B, ROD_A));
var ROD_N_UP = { x: ROD_U.y, y: -ROD_U.x };

/* ---------- i18n ---------- */
var STR = {

    power: 'パワー', throws: '投げた回数', best: 'ベスト', gripHint: '握る場所を選ぶ', gripDone: '選択済み',
    angle: '角度', spin: '回転', slow: '遅い', normal: '普通', fast: '速い', cw: '右回り', ccw: '左回り',
    throwBtn: '投げる', flying: '飛行中...', needGrip: 'まずハンガーを掴んでね',

    paused: '一時停止中', resume: '再開する', helpTitle: '遊び方', close: '閉じる',
    sndOn: '音 ON', sndOff: '音 OFF', pause: '一時停止', flip: '左右',

    keys: 'Space：投げる（長押しでパワー）　R：投げ直し　P：一時停止　M：音のON/OFF',
    helpBody: '1. 中央パネルのハンガーをクリックして掴む（掴む場所で回転が変わる）。\n2. 右の角度ウィンドウをクリック／ドラッグして角度を決める（10°〜80°）。\n3. 下の「投げる」ボタンを長押し→離して投げる。Spaceキーでも同じ。\n4. フックがポールの○に引っかかったら、その場でその○は成功。次のステージへ進む。3つのステージを全部クリアしたらクリア。\n5. 判定はかなりシビア。ワイヤーが○に当たると跳ね返る。○がフックの「？」の中にちょうど収まったときだけ引っかかる。ポールは○以外ただの背景。\n6. Rキー：飛行中のハンガーが複数あるときは一番新しい1本だけ落とす（投数は増えない）。'
  },
  en: {
    power: 'POWER', throws: 'THROWS', best: 'BEST', gripHint: 'Pick a grip point', gripDone: 'Grip set',
    angle: 'ANGLE', spin: 'Spin', slow: 'Slow', normal: 'Normal', fast: 'Fast', cw: 'CW', ccw: 'CCW',
    throwBtn: 'THROW', flying: 'Flying...', needGrip: 'Grab the hanger first!',
    title: 'HANGER TOSS', subtitle: '(prototype)',
    howto1: 'Click the hanger in the center panel to grab it.',
    howto2: 'Set the angle and power, then hold and release the button to throw.',
    howto3: 'Hook a band and it counts at once. Clear all 3 stages to win.',
    howto4: 'The grip point changes the spin. Same grip + angle + power = same flight.',
    start: 'START', clearTitle: 'HOOKED!', clearThrows: ' throws to clear!', retry: 'Throw again',
    paused: 'PAUSED', resume: 'Resume', helpTitle: 'How to play', close: 'Close',
    sndOn: 'SND ON', sndOff: 'SND OFF', pause: 'Pause', flip: 'Flip',
    throwN: 'Throw ', stage: 'Stage', waiting: 'Getting ready...',
    keys: 'Space: throw (hold for power)  R: retry throw  P: pause  M: mute',
    helpBody: '1. Click the hanger in the center panel to grab it (grip changes the spin).\n2. Click / drag the angle window to set the angle (10°-80°).\n3. Hold and release the THROW button (or Space) to throw.\n4. Hook a band on a pole and it counts at once. You move on to the next stage. Clear all 3 stages to win.\n5. The judgment is very strict. The wire bounces off the band. It only catches when the band center fits exactly inside the hook loop. The rest of the pole is just background.\n6. R: drop only the newest mid-flight hanger (no extra throw counted).'
  }
};
function t(k) {
  var d = STR[game.lang] || STR.ja;
  return d[k] !== undefined ? d[k] : (STR.ja[k] || k);
}

/* ---------- audio (WebAudio synthesis only) ---------- */
var actx = null, masterGain = null;
function ensureAudio() {
  if (actx) return;
  try {
    var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    actx = new AC();
    masterGain = actx.createGain();
    masterGain.gain.value = game.muted ? 0 : 0.5;
    masterGain.connect(actx.destination);
  } catch (e) { actx = null; }
}
function tone(freq, dur, type, vol, slideTo) {
  if (!actx || game.muted) return;
  try {
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), actx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.2, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(masterGain);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
function noiseBurst(dur, vol) {
  if (!actx || game.muted) return;
  try {
    var len = Math.max(1, Math.floor(actx.sampleRate * dur));
    var buf = actx.createBuffer(1, len, actx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var s = actx.createBufferSource(); s.buffer = buf;
    var g = actx.createGain(); g.gain.value = vol || 0.15;
    s.connect(g); g.connect(masterGain); s.start();
  } catch (e) {}
}
function playThrow() { tone(600, 0.25, 'sine', 0.18, 180); noiseBurst(0.12, 0.08); }
function playBounce() { tone(170, 0.08, 'square', 0.10); }
function playClank() { tone(1250, 0.06, 'square', 0.10); tone(1900, 0.05, 'square', 0.06); }
/* v13: rate-limit the bounce click per flight. Returns true when it fires. */
function maybeClank(fl) {
  var last = (fl.lastClankT === undefined) ? -1 : fl.lastClankT;
  if (fl.time - last < CLANK_COOLDOWN) return false;
  fl.lastClankT = fl.time;
  playClank();
  return true;
}
function playCatch() { tone(950, 0.05, 'square', 0.20); tone(1500, 0.09, 'square', 0.18); noiseBurst(0.05, 0.12); }
function playFail() { tone(130, 0.25, 'sine', 0.18, 55); }
function playClick() { tone(800, 0.04, 'square', 0.08); }
function playClear() {
  if (!actx || game.muted) return;
  var notes = [523, 659, 784, 1047];
  for (var i = 0; i < notes.length; i++) {
    (function (f, delay) {
      setTimeout(function () { tone(f, 0.22, 'triangle', 0.20); }, delay);
    })(notes[i], i * 130);
  }
}
var BGM_NOTES = [262, 330, 392, 330, 294, 370, 440, 370];
function bgmNote() {
  if (!actx || game.muted) return;
  var f = BGM_NOTES[game.bgmStep % BGM_NOTES.length];
  game.bgmStep++;
  tone(f, 0.4, 'triangle', 0.035);
}

/* ---------- hanger model: the 5-segment list (spec v09) ----------
   NEVER a diamond/kite. Hook on top, triangle body below.
   1. hook: 270-degree arc around HOOK_LOOP_CENTER, base -> right -> top
      -> left, then a short return curling down/inward to HOOK_TIP ("?" shape)
   2. stem: base -> apex
   3. left side: apex -> body left
   4. right side: apex -> body right
   5. bottom bar: body left -> body right
   The hook arc is a polyline of 19 points (15-degree steps) + the tip. */
/* v20 (027): mirror a local point across the vertical axis (x -> -x).
   The hanger is left-facing (canonical) or right-facing (flipped) per game.
   The grip is stored in the current frame, so a grip on the right side of
   the drawn hanger has local x > 0 canonical but x < 0 flipped — and the
   spin direction (from the grip's local x sign) flips with it. */
function mx(p, flip) { return flip ? { x: -p.x, y: p.y } : p; }
function hookArcPoints(flip) {
  var pts = [];
  for (var i = 0; i <= 18; i++) {
    var a = (90 - i * 15) * D2R;
    var px = HOOK_LOOP_CENTER.x + HOOK_LOOP_RADIUS * Math.cos(a);
    var py = HOOK_LOOP_CENTER.y + HOOK_LOOP_RADIUS * Math.sin(a);
    pts.push({ x: flip ? -px : px, y: py });
  }
  pts.push({ x: flip ? -HOOK_TIP.x : HOOK_TIP.x, y: HOOK_TIP.y });
  return pts;
}
var HANGER_SEGMENTS = [
  { type: 'polyline', points: hookArcPoints() },
  { type: 'line', p0: HOOK_BASE, p1: APEX },
  { type: 'line', p0: APEX, p1: BODY_L },
  { type: 'line', p0: APEX, p1: BODY_R },
  { type: 'line', p0: BODY_L, p1: BODY_R }
];
/* wire as polylines (for grip snapping and collision sampling).
   Canonical when flip is falsy; mirrored when flip is true. Callers that
   pass points to localToWorld must use the CANONICAL list (localToWorld
   mirrors by st.flip itself); callers in the panel frame (grip snapping,
   random grip) pass game.flip. */
function hangerWirePoints(flip) {
  return [hookArcPoints(flip), [mx(HOOK_BASE, flip), mx(APEX, flip)], [mx(APEX, flip), mx(BODY_L, flip)], [mx(APEX, flip), mx(BODY_R, flip)], [mx(BODY_L, flip), mx(BODY_R, flip)]];
}
/* wire part names, parallel to hangerWirePoints() */
var WIRE_PARTS = ['hook', 'stem', 'left', 'right', 'bottom'];
/* nearest point on the wire to a local point; returns {point, dist} (local units).
   The point is in the panel frame: the wire is mirrored by game.flip, so the
   returned grip is in the same (possibly mirrored) frame as the drawn hanger. */
function nearestWirePoint(local) {
  var wires = hangerWirePoints(game.flip);
  var best = null, bestD = Infinity;
  for (var w = 0; w < wires.length; w++) {
    var pts = wires[w];
    for (var i = 0; i < pts.length - 1; i++) {
      var r = distPtSeg(local, pts[i], pts[i + 1]);
      if (r.d < bestD) { bestD = r.d; best = { x: r.x, y: r.y }; }
    }
  }
  return { point: best, dist: bestD };
}
/* ---------- v16 (021/022) helpers ---------- */
/* v16 (021): a uniform random point along the whole wire (length-weighted).
   Used for the default grip at game start; flight itself has no randomness. */
function randomGripPoint() {
  var wires = hangerWirePoints(game.flip); /* v20 (027): pick on the mirrored wire when flipped */
  var segs = [], total = 0;
  for (var w = 0; w < wires.length; w++) {
    var pts = wires[w];
    for (var i = 0; i < pts.length - 1; i++) {
      var l = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
      segs.push({ a: pts[i], b: pts[i + 1], len: l });
      total += l;
    }
  }
  var r = Math.random() * total;
  for (var j = 0; j < segs.length; j++) {
    if (r <= segs[j].len) {
      var tt = segs[j].len === 0 ? 0 : r / segs[j].len;
      return { x: segs[j].a.x + (segs[j].b.x - segs[j].a.x) * tt, y: segs[j].a.y + (segs[j].b.y - segs[j].a.y) * tt };
    }
    r -= segs[j].len;
  }
  var lastSeg = segs[segs.length - 1];
  return { x: lastSeg.b.x, y: lastSeg.b.y };
}
function setRandomGrip() {
  game.grip = randomGripPoint();
  game.dNorm = Math.min(1, Math.hypot(game.grip.x, game.grip.y) / GRIP_NORM);
}
/* v20 (026): the ○s are a list, mutated in place. setCatchPoints(ts)
   replaces the list with one ○ per t (each {x, y, t, done:false}).
   setCatchPointT(t) is kept for the debug harness: a single ○ at t.
   catchPointT() returns the first ○'s t (0.5 when the list is empty). */
function setCatchPoints(ts) {
  /* v26 (035): replacing the ○ list restarts the stages at stage 1. */
  game.stage = 0;
  CATCH_POINTS.length = 0;
  for (var i = 0; i < ts.length; i++) {
    var t = clamp(ts[i], 0, 1);
    CATCH_POINTS.push({
      x: ROD_A.x + (ROD_B.x - ROD_A.x) * t,
      y: ROD_A.y + (ROD_B.y - ROD_A.y) * t,
      t: t, done: false
    });
  }
  return ts;
}
function setCatchPointT(t) {
  return setCatchPoints([t])[0];
}
function catchPointT() {
  return CATCH_POINTS.length ? CATCH_POINTS[0].t : 0.5;
}
/* v26 (035): the current stage's ○ (CATCH_POINTS[game.stage]); null when all stages are done. */
function currentRing() {
  return (game.stage >= 0 && game.stage < CATCH_POINTS.length) ? CATCH_POINTS[game.stage] : null;
}
/* v25 (034): TRIANGLE placement (replaces the v20/v24 random-t placement).
   P1 is uniform in t in [0.4, 0.85] on the rod; P2 = P1 + S along the rod
   (up-right); P3 = P1 + S at rod angle - 60 deg (almost straight up).
   S = 120 screen px = 200 world (provisional: the assistant's number).
   The three form an equilateral triangle; the fixed 120px spacing keeps
   every ○ hookable (the loop is ~40px wide and ○s are solid, so a
   neighbouring ○ too close can block the hook). P1 t is capped at 0.85
   so the triangle (plus poles, ~40px) always fits on screen; a placement
   that ever went off screen is re-rolled, never clamped. The old pairwise
   |Δt| >= 0.08 rule no longer applies (distances are fixed by the
   triangle); the old fallback fill is gone. setCatchPoints(ts) is kept
   for the debug harness (a single ○ at t). Returns the three points. */
var TRIANGLE_SIDE_SCREEN = 120; /* provisional (assistant's choice) */
var TRIANGLE_SIDE = TRIANGLE_SIDE_SCREEN / VIEW_SCALE; /* 200 world */
function setCatchPointsXY(pts) {
  /* v26 (035): replacing the ○ list restarts the stages at stage 1. */

  return game.phase === 'charging' ? game.power : game.lastPower;
}

/* ---------- particles ---------- */
function spawnDust(x, y) {
  for (var i = 0; i < 6; i++) game.particles.push({
    x: w2sx(x), y: w2sy(y), vx: (Math.random() - 0.5) * 60, vy: -Math.random() * 40 - 10,
    life: 0.5, max: 0.5, size: 3, color: '#9fb3ae'
  });
}
function spawnSparks(x, y) {
  for (var i = 0; i < 10; i++) game.particles.push({
    x: w2sx(x), y: w2sy(y), vx: (Math.random() - 0.5) * 220, vy: (Math.random() - 0.5) * 220,
    life: 0.4, max: 0.4, size: 2.5, color: (i % 2) ? '#ff7a1a' : '#ffd23f'
  });
}
function spawnConfetti() {
  var cols = ['#ff7a1a', '#2a7fff', '#ffd23f', '#4caf50', '#ff5252'];
  for (var i = 0; i < 90; i++) game.particles.push({
    x: Math.random() * CV_W, y: -10 - Math.random() * 80,
    vx: (Math.random() - 0.5) * 40, vy: 60 + Math.random() * 120,
    life: 3, max: 3, size: 4 + Math.random() * 4, color: cols[i % 5], sway: Math.random() * Math.PI * 2
  });
}
function updateParticles(dt) {
  for (var i = game.particles.length - 1; i >= 0; i--) {
    var p = game.particles[i];
    p.life -= dt;
    if (p.life <= 0) { game.particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.sway !== undefined) p.x += Math.sin(p.life * 6 + p.sway) * 20 * dt;
    p.vy += 30 * dt;
  }
}

/* ---------- flow ---------- */
function startGame() {
  game.state = 'playing'; game.phase = 'ready';
  game.throws = 0; game.failed = []; game.flights = [];
  game.angle = 45; game.power = 0; game.lastPower = 0;
  game.flip = Math.random() < 0.5; /* v20 (027): left- or right-facing hanger, 50/50 */
  setRandomGrip(); /* v16 (021): default grip is a random wire point */
  randomCatchPoint(); /* v25 (034): triangle placement — P1 t in [0.4, 0.85], P2/P3 at 120 screen px; v26 (035): stage resets to 0 there */
  playClick();
}
function retryGame() {
  game.state = 'playing'; game.phase = 'ready';
  game.throws = 0; game.failed = []; game.flights = [];
  game.standT = 0; game.gutsT = 0;
  game.flip = Math.random() < 0.5; /* v20 (027) */
  setRandomGrip(); /* v16 (021) */
  randomCatchPoint(); /* v25 (034): triangle placement; v26 (035): stage resets to 0 there */
  playClick();
}
function startCharge() {
  if (!game.grip) return;
  game.phase = 'charging'; game.chargeT = 0; game.power = 0;
}
function doThrow() {
  if (game.phase !== 'charging') return;
  var power = game.power;
  game.flights.push(newFlight(game.grip, game.angle, power));
  game.lastPower = power;
  game.throws += 1;
  game.phase = 'ready'; /* v09: throw again immediately, no input lock */
  game.swing = 1;
  game.throwPoseT = THROW_POSE_TIME; /* v14 (020): show the throwing pose for 0.2s */
  playThrow();
}
function removeFlight(fl) {
  var idx = game.flights.indexOf(fl);
  if (idx >= 0) game.flights.splice(idx, 1);
}
function abortFlight() {
  /* v09: drop only the newest flying hanger */
  var fl = game.flights[game.flights.length - 1];
  if (!fl) return;
  fl.v.x *= 0.3;
  fl.v.y = Math.max(fl.v.y, 80);
}
/* v26 (035): stages + no throw lock after a hook. A catch is decided
   IMMEDIATELY by catchSpeed (no 3.0s hang hold, no 'hanging' phase).
   Too fast (> SLIP_THRESHOLD) = slip: the hanger resumes flying at once
   with the same damped resume as the harness simulateThrow — G moves to
   the catch pivot (the loop centre), velocity = 0.3x the COM velocity
   with vy >= 80 down — the ○ is NOT marked done, the stage does NOT
   advance, phase stays 'ready'. The 0.2s slip-hang visual is dropped
   (there is no hang phase to show it in). The slipped ○ is uncatchable
   for this flight for 0.5s (slipRing/slipUntil, enforced in checkCatch):
   without that, the resume leaves the loop centre on the ○ and the very
   next substep re-hooks it, so the slip would not be a slip at all.
   Otherwise = hook: the ○ is marked done at once, the stage advances at
   once (the next ○ appears), the hooked hanger is removed (first catch
   wins: the other in-flight hangers are discarded, as in v25), phase stays
   'ready' — the player can throw again right away. A 0.1s hitStop freeze
   is kept on a hook (catch feel, as in v25); it does not block input.
   Returns true on a confirmed hook, false on a slip. */
function resolveCatch(fl) {
  var speed = fl.catchSpeed || 0;
  if (speed > SLIP_THRESHOLD) {
    /* slip: resume flying immediately, damped (same as simulateThrow) */
    var cv = comVel(fl);
    fl.G = catchPivotPos(fl);
    fl.v = { x: cv.x * 0.3, y: Math.max(cv.y, 80) };
    fl.status = 'flying'; fl.restT = 0;
    /* v26 (035): no immediate re-hook — this ○ is uncatchable for this flight for 0.5s (see checkCatch). */
    fl.slipRing = fl.caughtRing; fl.slipUntil = fl.time + 0.5;
    fl.caughtRing = null; fl.catchLocal = null; fl.catchSpeed = 0;
    return false;
  }
  /* confirmed hook: mark done at once, advance the stage at once */
  var ring = fl.caughtRing || currentRing();
  if (ring) {
    ring.done = true;
    spawnSparks(ring.x, ring.y);
  }
  game.flights = []; /* first catch wins: discard the other in-flight hangers (as in v25) */
  game.hitStop = 0.1;
  playCatch();
  game.stage++;
  if (game.stage >= CATCH_POINTS.length) {
    game.phase = 'guts'; game.gutsT = 0; game.standT = 0;
    spawnConfetti(); playClear();
  } else {
    game.phase = 'ready';
  }
  return true;
}
function endThrowFail(fl) {
  var rest = restingTransform(fl);
  rest.rot0 = ((fl.rot % 360) + 360) % 360; /* rotation at the stop */
  rest.y0 = fl.G.y; /* G.y at the stop (the hanger rests on the floor there) */
  rest.settleT = 0; /* v13 (019): tips over flat over SETTLE_TIME */
  game.failed.push(rest);
  if (game.failed.length > 5) game.failed.shift();
  /* v09: phase is already 'ready' — no wait, no input lock */
  playFail();
}
function toggleMute() {
  game.muted = !game.muted;
  if (masterGain) masterGain.gain.value = game.muted ? 0 : 0.5;
}
function togglePause() {
  if (game.state !== 'playing') return;
  game.paused = !game.paused;
}
function toggleLang() {
  game.lang = game.lang === 'ja' ? 'en' : 'ja';
  playClick();
}
/* v28 (037): set the hanger orientation. The grip is stored in the
   (possibly mirrored) panel frame, so when the orientation changes the
   stored grip mirrors with the wire (grip.x -> -grip.x) and stays on the
   same physical wire point. dNorm is unchanged (hypot is symmetric in x);
   the spin sign flips with the grip, i.e. the mirrored throw. */
function applyFlip(b) {
  b = !!b;
  if (b === game.flip) return game.flip;
  game.flip = b;
  if (game.grip) game.grip.x = -game.grip.x;
  return game.flip;
}
function toggleFlip() {
  if (game.state !== 'playing') return;
  applyFlip(!game.flip);
  playClick();
}

/* ---------- update ---------- */
function update(dt) {
  if (actx && !game.muted && game.state === 'playing' && !game.paused) {
    game.bgmT += dt;
    if (game.bgmT > 0.42) { game.bgmT = 0; bgmNote(); }
  }
  updateParticles(dt);
  updateFailed(dt); /* v13 (019): advance the tip-over settle of stopped hangers */
  if (game.hitStop > 0) { game.hitStop -= dt; return; }
  if (game.state !== 'playing') return;
  if (game.swing > 0) game.swing = Math.max(0, game.swing - dt * 3);
  if (game.throwPoseT > 0) game.throwPoseT = Math.max(0, game.throwPoseT - dt); /* v14 (020) */
  if (game.phase === 'charging') {
    game.chargeT += dt;
    game.power = Math.min(100, game.chargeT / POWER_CHARGE_TIME * 100);
  }
  /* v09: step every flying hanger; the player can already throw again.
     v26 (035): a catch is resolved at once by resolveCatch (hook or slip);
     a hook never blocks input, so there is no 'hanging' phase. */
  if ((game.phase === 'ready' || game.phase === 'charging') && game.flights.length > 0) {
    var sub = Math.max(1, Math.ceil(dt / (1 / 480)));
    var sdt = dt / sub;
    var snapshot = game.flights.slice();
    for (var fi = 0; fi < snapshot.length; fi++) {
      var fl = snapshot[fi];
      if (game.flights.indexOf(fl) < 0) continue; /* discarded by an earlier hook this update */
      var done = false;
      for (var i = 0; i < sub && !done; i++) {
        var r = stepFlight(fl, sdt);
        for (var j = 0; j < r.events.length; j++) {
          var e = r.events[j];
          if (e.t === 'floor') { playBounce(); spawnDust(e.x, e.y); }
          if (e.t === 'bounce') { maybeClank(fl); } /* v13: at most once per 60ms per flight */
        }
        if (fl.status === 'caught') { done = true; resolveCatch(fl); }
        else if (fl.status === 'stopped') { removeFlight(fl); endThrowFail(fl); done = true; }
        else if (fl.status === 'despawned') { removeFlight(fl); done = true; }
      }
      if (game.phase === 'guts') break; /* hooked the last ○: stop stepping */
    }
  }
  /* v26 (035): no 'hanging' phase any more — a hook resolves at once in resolveCatch. */
  if (game.phase === 'guts') {
    game.gutsT += dt;
    game.standT = Math.min(1, game.gutsT / 0.5);
    if (game.gutsT >= 2.0) {
      game.state = 'clear';
      if (game.best === null || game.throws < game.best) { game.best = game.throws; saveBest(game.best); }
    }
  }
}

/* ---------- input ---------- */
var dragMode = null; /* 'angle' | 'throw' | null */
function tryGrip(p) {
  var local = { x: (p.x - PANEL_C.x) / PANEL_SCALE, y: (p.y - PANEL_C.y) / PANEL_SCALE };
  var near = nearestWirePoint(local);
  if (near.dist * PANEL_SCALE > 30) return; /* too far from the wire: invalid */
  game.grip = { x: near.point.x, y: near.point.y };
  game.dNorm = Math.min(1, Math.hypot(game.grip.x, game.grip.y) / GRIP_NORM);
  playClick();
}
function setAngleFromPoint(p) {
  var dx = p.x - ANGLE_ORIGIN.x, dy = ANGLE_ORIGIN.y - p.y;
  var deg = Math.atan2(dy, dx) * R2D;
  game.angle = clamp(deg, 10, 80);
}

/* ---------- drawing ---------- */
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function line2(ctx, a, b) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }

function drawTitleStrip(ctx) {
  ctx.fillStyle = '#0d242c';
  ctx.fillRect(0, 0, CV_W, 30);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 17px sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(game.lang === 'ja' ? 'HANGER TOSS　ハンガー投げ（仮）' : 'HANGER TOSS (prototype)', 16, 16);
  /* top-right buttons: EN / ? / sound / pause */
  var btns = [
    { r: BTN_EN, label: game.lang === 'ja' ? 'EN' : 'JP' },
    { r: BTN_HELP, label: '?' },
    { r: BTN_SND, label: game.muted ? t('sndOff') : t('sndOn') },
    { r: BTN_PAUSE, label: t('pause') }
  ];
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    ctx.fillStyle = '#1d4a57';
    rr(ctx, b.r.x, b.r.y, b.r.w, b.r.h, 5); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText(b.label, b.r.x + b.r.w / 2, b.r.y + b.r.h / 2 + 0.5);
  }
}

function drawHUD(ctx) {
  /* left panel: power */
  ctx.fillStyle = '#16424e';
  rr(ctx, 20, 32, 280, 106, 8); ctx.fill();
  ctx.fillStyle = '#9fc4cc';
  ctx.font = '13px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(t('power'), 40, 48);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(Math.round(dispPower()) + '%', 280, 48);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#0d242c';
  ctx.fillRect(40, 56, 240, 16);
  var pw = dispPower();
  ctx.fillStyle = pw < 34 ? '#4caf50' : (pw < 67 ? '#ffcf3f' : '#ff5252');
  if (pw > 0) ctx.fillRect(40, 56, 240 * pw / 100, 16);
  ctx.fillStyle = '#9fc4cc';
  ctx.font = '12px sans-serif';
  ctx.fillText(t('throws'), 40, 92);
  drawHanger(ctx, 56, 108, 0, 0.15, { x: 0, y: 0 }, undefined, { color: '#f2f2f2', width: 6 * HANGER_SCALE }, game.flip); /* v16 (021): white panel hanger; v20 (027): mirrored when flipped */
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText('× ' + game.throws, 76, 110);
  /* v26 (035): current stage under the throws count (stage = done count + 1, clamped at the last stage) */
  var stageN = Math.min(game.stage + 1, CATCH_POINTS.length);
  ctx.fillStyle = '#9fc4cc';
  ctx.font = '12px sans-serif';
  ctx.fillText(t('stage') + ' ' + stageN + '/' + CATCH_POINTS.length, 40, 131);
  ctx.fillStyle = '#9fc4cc';
  ctx.font = '13px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(t('best') + ' ' + (game.best === null ? '—' : game.best), 280, 110);
  ctx.textAlign = 'left';

  /* center panel: grip */
  ctx.fillStyle = '#16424e';
  rr(ctx, 330, 32, 300, 106, 8); ctx.fill();
  ctx.fillStyle = '#9fc4cc';
  ctx.font = '13px sans-serif';
  ctx.fillText('GRIP', 342, 48);
  ctx.fillStyle = game.grip ? '#7fd0ff' : '#9fc4cc';
  ctx.textAlign = 'right';
  ctx.fillText(game.grip ? t('gripDone') : t('gripHint'), 618, 48);
  ctx.textAlign = 'left';
  /* v09: the panel hanger is never dimmed during flight */
  drawHanger(ctx, PANEL_C.x, PANEL_C.y, 0, PANEL_SCALE, { x: 0, y: 0 }, undefined, { color: '#f2f2f2', width: 6 * HANGER_SCALE }, game.flip); /* v16 (021): white panel hanger; v20 (027): mirrored when flipped */
  if (game.grip) {
    var gp = { x: PANEL_C.x + game.grip.x * PANEL_SCALE, y: PANEL_C.y + game.grip.y * PANEL_SCALE };
    ctx.beginPath(); ctx.arc(gp.x, gp.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#2a7fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(gp.x, gp.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
  }
  /* v29 (038): flip button inside the GRIP panel, bottom-right (568-618 x 110-132).
     Clear of the hanger wire (wire x ends ~512, grip-click halo ends ~542) and of the
     'GRIP' label and grip-status text (both on the top row). Drawn only while playing. */
  if (game.state === 'playing') {
    ctx.fillStyle = '#1d4a57';
    rr(ctx, BTN_FLIP.x, BTN_FLIP.y, BTN_FLIP.w, BTN_FLIP.h, 5); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t('flip'), BTN_FLIP.x + BTN_FLIP.w / 2, BTN_FLIP.y + BTN_FLIP.h / 2 + 0.5);
    ctx.textAlign = 'left';
  }

  /* right panel: angle */
  ctx.fillStyle = '#16424e';
  rr(ctx, 660, 32, 280, 106, 8); ctx.fill();
  ctx.fillStyle = '#9fc4cc';
  ctx.font = '13px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(t('angle'), 930, 48);
  /* grid */
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var gx = ANGLE_GRID.x0; gx <= ANGLE_GRID.x1; gx += 20) { ctx.moveTo(gx, ANGLE_GRID.y0); ctx.lineTo(gx, ANGLE_GRID.y1); }
  for (var gy = ANGLE_GRID.y0; gy <= ANGLE_GRID.y1; gy += 20) { ctx.moveTo(ANGLE_GRID.x0, gy); ctx.lineTo(ANGLE_GRID.x1, gy); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.strokeRect(ANGLE_GRID.x0, ANGLE_GRID.y0, ANGLE_GRID.x1 - ANGLE_GRID.x0, ANGLE_GRID.y1 - ANGLE_GRID.y0);
  /* arrow from bottom-left origin */
  var a = game.angle * D2R;
  var ax = ANGLE_ORIGIN.x + 60 * Math.cos(a), ay = ANGLE_ORIGIN.y - 60 * Math.sin(a);
  ctx.strokeStyle = '#ff7a1a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  line2(ctx, ANGLE_ORIGIN, { x: ax, y: ay });
  ctx.fillStyle = '#ff7a1a';
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(ax - 10 * Math.cos(a - 0.4), ay + 10 * Math.sin(a - 0.4));
  ctx.lineTo(ax - 10 * Math.cos(a + 0.4), ay + 10 * Math.sin(a + 0.4));
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(ANGLE_ORIGIN.x, ANGLE_ORIGIN.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#ff7a1a'; ctx.fill();
  /* degrees + spin readout */
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText(game.angle.toFixed(1) + '°', 930, 78);
  ctx.fillStyle = '#9fc4cc';
  ctx.font = '13px sans-serif';
  ctx.fillText(t('spin') + '：' + spinLabel() + (game.grip ? '・' + spinDirLabel() : ''), 930, 108);
  ctx.textAlign = 'left';
}

/* ---------- v14 (020): user-drawn background + thrower (data URIs) ---------- */
/* Background: room photo, 960x540 cover crop (floor at screen y~472, so the
   wood covers the floor line at y=500). Thrower: transparent PNG, split at
   x=370 (left = idle, right = throwing). Placement (screen coords, one
   scale + one anchor for both halves so the chair never jumps):
   scale 0.525 -> figure 400px tall = 210 screen px, feet on the floor
   (y=500), fingertip X exactly on the throw origin (screen x=198).
   NOTE (placement conflict, measured): the drawing's fingertip-to-feet
   distance is 390px but the throw origin is only 120px above the floor,
   so at full size the fingertip lands at screen (198, 303), 77px above
   the throw origin (198, 380). The chair back lands at screen x=46,
   ~26px left of the chair zone (72-180). The chair legs also float
   ~15px: in the sketch the chair legs (y~409) are shorter than the feet

  var swingA = (41 + 24 * game.swing) * D2R;
  var armLen = 152;
  var handR0 = { x: sho.x + armLen * Math.cos(swingA), y: sho.y + armLen * Math.sin(swingA) };
  var handL0 = { x: sho.x + 45, y: sho.y + 160 };
  var handR = { x: handR0.x + (sho.x + 70 - handR0.x) * raise, y: handR0.y + (sho.y - 120 - wave - handR0.y) * raise };
  var handL = { x: handL0.x + (sho.x - 70 - handL0.x) * raise, y: handL0.y + (sho.y - 120 + wave - handL0.y) * raise };
  /* torso */
  ctx.strokeStyle = '#2a7f8f'; ctx.lineWidth = 16 * VIEW_SCALE;
  line2(ctx, w2s(hip), w2s(sho));
  /* arms */
  ctx.lineWidth = 11 * VIEW_SCALE;
  line2(ctx, w2s(sho), w2s(handR));
  line2(ctx, w2s(sho), w2s(handL));
  /* hands */
  ctx.fillStyle = '#f0c8a0';
  var hr = w2s(handR), hl = w2s(handL);
  ctx.beginPath(); ctx.arc(hr.x, hr.y, 7 * VIEW_SCALE, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(hl.x, hl.y, 7 * VIEW_SCALE, 0, Math.PI * 2); ctx.fill();
  /* head */
  var hd = w2s(head);
  ctx.beginPath(); ctx.arc(hd.x, hd.y, 30 * VIEW_SCALE, 0, Math.PI * 2);
  ctx.fillStyle = '#f0c8a0'; ctx.fill();
  ctx.beginPath(); ctx.arc(hd.x, hd.y - 6 * VIEW_SCALE, 30 * VIEW_SCALE, Math.PI, 0);
  ctx.fillStyle = '#2b2b33'; ctx.fill();
}

function drawPlayfield(ctx) {
  /* v14 (020): the room photo (drawn first in draw()) is the background
     and the wooden floor is the floor. No gradient, no mint floor strip,
     no floor line. */
  /* failed hangers lying on the floor (v13 (019): they tip over flat over 0.25s) */
  for (var i = 0; i < game.failed.length; i++) {
    var f = game.failed[i];
    var sp = settlePose(f);
    ctx.save(); ctx.globalAlpha = 0.85;
    drawHanger(ctx, w2sx(f.x), w2sy(sp.y), sp.rot, VIEW_SCALE, f.grip, sp.scaleY, undefined, f.flip);
    ctx.restore();
  }
  /* v23 (032): one pole per ○ (3 poles). The pole image is drawn at its
     NATIVE angle (no rotation), at uniform 1/5 scale (v24 (033): was 2/3
     in v23), positioned so the ○ sits at the pole's midpoint (the centre
     of the cap-to-cap segment).
     The single long rod across A-B is gone; A and B remain only as the
     placement line for the ○s. The image carries its own shadow, so the
     code-drawn floor shadow is gone. Still background only: no collision
     except the ○. Uniform scale means the end caps stay circular (the
     v22 oval-cap side effect is gone).
     v26 (035): only the current stage's ○ has a pole (later stages are hidden). */
  var ra = w2s(ROD_A), rb = w2s(ROD_B);
  var plen = Math.hypot(rb.x - ra.x, rb.y - ra.y);
  var pscale = POLE_SCALE * plen / POLE_CAP_LEN; /* ~0.195: cap-to-cap ~77 screen px, shaft ~5.6 screen px (~9.3 world) */
  var curPole = currentRing();
  if (curPole && POLE_IMG && POLE_IMG.complete && POLE_IMG.naturalWidth) {
    var pc = w2s(curPole);
    ctx.drawImage(POLE_IMG,
      pc.x - pscale * POLE_CAP_MID.x, pc.y - pscale * POLE_CAP_MID.y,
      POLE_IMG.naturalWidth * pscale, POLE_IMG.naturalHeight * pscale);
  }
  /* v21 (030): the catch-point marker is a yellow band wrapped around the
     pole (yellow #f8c758 sampled from the user's band reference image).
     One band on the current stage's ○, drawn on top of the pole image.
     The band is a visual marker only: the hit detection
     is still the ○ point (LOOP_FIT_RADIUS 12px, v25 (034), gap sector, speed gates).
     v23 (032): the band is rotated to the POLE's angle (POLE_CAP_ANG),
     not the rod's; its width is the uniform-scale pole width + 8 world px.
     v26 (035): only the current stage's band is drawn (later stages are hidden).
     v27 (036): band is fixed size — the pulse animation is removed (user, 2026-11-26). */
  var curBand = currentRing();
  if (curBand) {
    var mk = curBand;
    var cp = w2s(mk);
    var bandLen = 20 * VIEW_SCALE; /* along the pole: 20 world px, fixed (v27 (036): no pulse) */
    var bandWid = POLE_SHAFT_W_IMG * pscale + 8 * VIEW_SCALE; /* across: pole width + 8 world px (v24 (033): pole width from the uniform 1/5 scale, ~9.3 world -> band ~12.0 x 10.4 screen px) */
    ctx.save();
    ctx.translate(cp.x, cp.y);
    ctx.rotate(POLE_CAP_ANG);
    rr(ctx, -bandLen / 2, -bandWid / 2, bandLen, bandWid, 4);
    ctx.fillStyle = '#f8c758'; ctx.fill();
    ctx.strokeStyle = '#c99430'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }
  /* thrower (v14 (020) + v21 (028)): user-drawn image while seated;
     the user's guts-pose image for the stand-up + guts pose. */
  if (game.phase === 'guts' || game.state === 'clear' || game.standT > 0) drawGutsImage(ctx);
  else drawThrowerImage(ctx);
  /* flying hangers (v09: several may fly at once) */
  for (var fi2 = 0; fi2 < game.flights.length; fi2++) {
    var fl2 = game.flights[fi2];
    var gp2 = w2s(fl2.G);
    drawHanger(ctx, gp2.x, gp2.y, fl2.rot, VIEW_SCALE, fl2.grip, undefined, undefined, fl2.flip);
  }
  /* v26 (035): no hanging hanger any more — a hook removes the hanger at once (resolveCatch), so there is nothing to draw here. */
  /* particles */
  for (var k = 0; k < game.particles.length; k++) {
    var p = game.particles[k];
    ctx.save();
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    ctx.restore();
  }
}

function drawThrowButton(ctx) {
  var enabled = game.phase === 'ready' || game.phase === 'charging';
  ctx.fillStyle = enabled ? '#e8862e' : '#7d8b90';
  rr(ctx, THROW_BTN.x, THROW_BTN.y, THROW_BTN.w, THROW_BTN.h, 10); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var label = game.phase === 'charging' ? t('power') + ' ' + Math.round(game.power) + '%' : t('throwBtn');
  ctx.fillText(label, THROW_BTN.x + THROW_BTN.w / 2, THROW_BTN.y + THROW_BTN.h / 2 + 1);
  ctx.textAlign = 'left';
  /* status text */
  ctx.fillStyle = '#33474d';
  ctx.font = '13px sans-serif';
  var status;
  if (game.flights.length > 0) status = t('flying') + ' \u00d7' + game.flights.length;
  else if (game.lang === 'ja') status = (game.throws + 1) + t('throwN') + '：' + game.angle.toFixed(1) + '° / ' + t('power') + ' ' + dispPower().toFixed(1) + '%';
  else status = t('throwN') + (game.throws + 1) + ': ' + game.angle.toFixed(1) + '° / ' + t('power') + ' ' + dispPower().toFixed(1) + '%';
  ctx.fillText(status, 12, 532);
  ctx.textAlign = 'right';
  ctx.fillText(t('best') + ' ' + (game.best === null ? '—' : game.best), 948, 532);
  ctx.textAlign = 'left';
}

function drawOverlay(ctx, x, y, w, h) {
  ctx.fillStyle = 'rgba(11,30,36,0.55)';
  ctx.fillRect(0, 0, CV_W, CV_H);
  ctx.fillStyle = '#12333d';
  rr(ctx, x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = '#2a7f8f'; ctx.lineWidth = 2;
  rr(ctx, x, y, w, h, 12); ctx.stroke();
}

function draw() {
  if (!ctx) return;
  ctx.clearRect(0, 0, CV_W, CV_H);
  /* v14 (020): user-drawn room background, whole canvas, behind everything */
  if (BG_IMG && BG_IMG.complete && BG_IMG.naturalWidth) ctx.drawImage(BG_IMG, 0, 0, CV_W, CV_H);
  else { ctx.fillStyle = '#eef4f2'; ctx.fillRect(0, 0, CV_W, CV_H); } /* fallback until the image loads */
  drawTitleStrip(ctx);
  drawHUD(ctx);
  drawPlayfield(ctx);
  drawThrowButton(ctx);
  if (game.state === 'title') {
    drawOverlay(ctx, 230, 120, 500, 300);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 44px sans-serif';
    ctx.fillText(t('title'), CV_W / 2, 190);
    ctx.font = '18px sans-serif'; ctx.fillStyle = '#9fc4cc';
    ctx.fillText(t('subtitle'), CV_W / 2, 225);
    ctx.font = '15px sans-serif'; ctx.fillStyle = '#ffffff';
    ctx.fillText(t('howto1'), CV_W / 2, 258);
    ctx.fillText(t('howto2'), CV_W / 2, 282);
    ctx.fillText(t('howto3'), CV_W / 2, 306);
    ctx.fillStyle = '#9fc4cc'; ctx.font = '14px sans-serif';
    ctx.fillText(t('best') + ' ' + (game.best === null ? '—' : game.best), CV_W / 2, 336);
    ctx.fillStyle = '#e8862e';
    rr(ctx, START_BTN.x, START_BTN.y, START_BTN.w, START_BTN.h, 10); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText(t('start'), CV_W / 2, START_BTN.y + START_BTN.h / 2 + 1);
    ctx.textAlign = 'left';
  } else if (game.state === 'clear') {
    drawOverlay(ctx, 230, 130, 500, 280);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 38px sans-serif';
    ctx.fillText(t('clearTitle'), CV_W / 2, 200);
    ctx.font = '24px sans-serif';
    if (game.lang === 'ja') ctx.fillText(game.throws + t('clearThrows'), CV_W / 2, 250);
    else ctx.fillText(game.throws + t('clearThrows'), CV_W / 2, 250);
    ctx.font = '18px sans-serif'; ctx.fillStyle = '#9fc4cc';
    ctx.fillText(t('best') + ' ' + (game.best === null ? '—' : game.best), CV_W / 2, 285);
    ctx.fillStyle = '#e8862e';
    rr(ctx, RETRY_BTN.x, RETRY_BTN.y, RETRY_BTN.w, RETRY_BTN.h, 10); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px sans-serif';
    ctx.fillText(t('retry'), CV_W / 2, RETRY_BTN.y + RETRY_BTN.h / 2 + 1);
    ctx.textAlign = 'left';
  }
  if (game.showHelp) {
    drawOverlay(ctx, 180, 80, 600, 380);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText(t('helpTitle'), CV_W / 2, 120);
    ctx.font = '15px sans-serif'; ctx.textAlign = 'left';
    var lines = t('helpBody').split('\n');
    for (var i = 0; i < lines.length; i++) ctx.fillText(lines[i], 210, 160 + i * 26);
    ctx.fillStyle = '#9fc4cc'; ctx.font = '13px sans-serif';
    ctx.fillText(t('keys'), 210, 160 + lines.length * 26 + 8);
    ctx.fillStyle = '#e8862e';
    rr(ctx, CLOSE_BTN.x, CLOSE_BTN.y, CLOSE_BTN.w, CLOSE_BTN.h, 8); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(t('close'), CLOSE_BTN.x + CLOSE_BTN.w / 2, CLOSE_BTN.y + CLOSE_BTN.h / 2 + 1);
    ctx.textAlign = 'left';
  }
  if (game.paused && game.state === 'playing') {
    ctx.fillStyle = 'rgba(11,30,36,0.6)';
    ctx.fillRect(0, 0, CV_W, CV_H);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillText(t('paused'), CV_W / 2, 240);
    ctx.fillStyle = '#e8862e';
    rr(ctx, RESUME_BTN.x, RESUME_BTN.y, RESUME_BTN.w, RESUME_BTN.h, 10); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px sans-serif';
    ctx.fillText(t('resume'), CV_W / 2, RESUME_BTN.y + RESUME_BTN.h / 2 + 1);
    ctx.textAlign = 'left';
  }
}

/* ---------- main loop ---------- */
var lastT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  var dt = Math.min(0.033, ((ts - lastT) / 1000) || 0.016);
  lastT = ts;
  game.time = (game.time || 0) + dt;
  if (!game.paused) update(dt);
  draw();
}

/* ---------- input wiring ---------- */
var canvas = null, ctx = null;
if (typeof document !== 'undefined' && document.getElementById) {
  canvas = document.getElementById('game');
  if (canvas && canvas.getContext) ctx = canvas.getContext('2d');
}
function canvasPos(e) {
  var r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (CV_W / r.width), y: (e.clientY - r.top) * (CV_H / r.height) };
}
if (canvas && ctx) {
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();
    if (actx && actx.state === 'suspended') actx.resume();
    var p = canvasPos(e);
    if (game.showHelp) { game.showHelp = false; return; }
    if (hitRect(p, BTN_EN)) { toggleLang(); return; }
    if (hitRect(p, BTN_HELP)) { game.showHelp = true; return; }
    if (hitRect(p, BTN_SND)) { toggleMute(); return; }
    if (hitRect(p, BTN_PAUSE)) { togglePause(); return; }
    if (game.paused) { game.paused = false; return; }
    if (game.state === 'title') {
      if (hitRect(p, START_BTN)) startGame();
      return;
    }
    if (game.state === 'clear') {
      if (hitRect(p, RETRY_BTN)) retryGame();
      return;
    }
    /* v29 (038): flip button hit-test runs before the grip logic, so a click on
       the button toggles the flip and never also grips. Checked in any playing
       phase (ready/charging/flight/guts), as in v28 (037). */
    if (game.state === 'playing' && hitRect(p, BTN_FLIP)) { toggleFlip(); return; }
    if (game.state === 'playing' && (game.phase === 'ready' || game.phase === 'charging')) {
      if (p.x >= 330 && p.x <= 630 && p.y >= 32 && p.y <= 138) { tryGrip(p); return; }
      if (p.x >= ANGLE_GRID.x0 - 10 && p.x <= ANGLE_GRID.x1 + 10 && p.y >= ANGLE_GRID.y0 - 10 && p.y <= ANGLE_GRID.y1 + 10) {
        setAngleFromPoint(p);
        dragMode = 'angle';
        if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
        return;
      }
      if (hitRect(p, THROW_BTN)) {
        if (game.grip) {
          startCharge();
          dragMode = 'throw';
          if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
        }
        return;
      }
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (dragMode === 'angle') setAngleFromPoint(canvasPos(e));
  });
  canvas.addEventListener('pointerup', function (e) {
    if (dragMode === 'throw') { if (game.phase === 'charging') doThrow(); dragMode = null; }
    else if (dragMode === 'angle') { dragMode = null; }
  });
  canvas.addEventListener('pointercancel', function () {
    if (dragMode === 'throw' && game.phase === 'charging') { game.phase = 'ready'; game.power = 0; }
    dragMode = null;
  });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      if (e.repeat) return;
      ensureAudio();
      if (actx && actx.state === 'suspended') actx.resume();
      if (game.showHelp) { game.showHelp = false; return; }
      if (game.paused) { game.paused = false; return; }
      if (game.state === 'title') startGame();
      else if (game.state === 'clear') retryGame();
      else if (game.state === 'playing' && game.phase === 'ready' && game.grip) startCharge();
    } else if (e.code === 'KeyR') {
      if (game.state === 'playing' && (game.phase === 'ready' || game.phase === 'charging') && game.flights.length > 0) abortFlight();
    } else if (e.code === 'KeyM') {
      toggleMute();
    } else if (e.code === 'KeyP') {
      togglePause();
    }
  });
  document.addEventListener('keyup', function (e) {
    if (e.code === 'Space' && game.phase === 'charging') doThrow();
  });
  requestAnimationFrame(loop);
}

/* ---------- debug / test hook (also used by the Node harness) ---------- */
if (typeof globalThis !== 'undefined') {
  globalThis.HANGER_TOSS_DEBUG = {
    version: 'v30',
    simulateThrow: simulateThrow,
    newFlight: newFlight,
    stepFlight: stepFlight,
    checkCatch: checkCatch,
    loopCenterPos: loopCenterPos,
    hookArcPoints: hookArcPoints,
    localToWorld: localToWorld, catchPivotPos: catchPivotPos,
    comPos: comPos, comVel: comVel,
    hangerWirePoints: hangerWirePoints,
    nearestWirePoint: nearestWirePoint,
    drawHanger: drawHanger, drawHangerPath: drawHangerPath,
    restingTransform: restingTransform,
    settlePose: settlePose,
    updateFailed: updateFailed,
    maybeClank: maybeClank,
    randomCatchPoint: randomCatchPoint,
    setCatchPointsXY: setCatchPointsXY, /* v25 (034): set the ○ list from {x,y,t} points */
    setCatchPointT: setCatchPointT,
    catchPointT: catchPointT,
    setCatchPoints: setCatchPoints, /* v20 (026): set the ○ list from t values */
    randomGripPoint: randomGripPoint,
    setRandomGrip: setRandomGrip,
    setFlip: function (b) { return applyFlip(b); }, /* v20 (027); v28 (037): mirrors the grip with the wire */
    startGame: startGame,
    retryGame: retryGame,
    drawThrowerImage: drawThrowerImage,
    THROWER_S: THROWER_S, THROWER_DX: THROWER_DX, THROWER_DY: THROWER_DY, THROWER_DX_R: THROWER_DX_R,
    SETTLE_TIME: SETTLE_TIME,
    CLANK_COOLDOWN: CLANK_COOLDOWN,
    resolveCatch: resolveCatch, /* v26 (035): immediate hook/slip resolution (replaces enterHanging) */
    currentRing: currentRing, /* v26 (035): the current stage's ○ */
    endThrowFail: endThrowFail,
    update: update, /* v26 (035): exposed so the harness can drive the game (no hang hold any more) */
    HANGER_SEGMENTS: HANGER_SEGMENTS,
    WIRE_PARTS: WIRE_PARTS,
    game: game,
    get flip() { return game.flip; }, /* v20 (027): current hanger orientation */
    catchPoints: CATCH_POINTS, /* v20 (026): live list of {x, y, t, done} */
    constants: {
      VIEW_SCALE: VIEW_SCALE, WORLD_W: WORLD_W, WORLD_H: WORLD_H,
      GRAVITY: GRAVITY, LOOP_FIT_RADIUS: LOOP_FIT_RADIUS, GAP_MIN: GAP_MIN, GAP_MAX: GAP_MAX, CATCH_POINTS: CATCH_POINTS,
      HANGER_SCALE: HANGER_SCALE, GRIP_NORM: GRIP_NORM, TRIANGLE_SIDE: TRIANGLE_SIDE, TRIANGLE_SIDE_SCREEN: TRIANGLE_SIDE_SCREEN,
      CONTACT_DIST: CONTACT_DIST, WIRE_HALF_WIDTH: WIRE_HALF_WIDTH, BOUNCE_E_HOOK: BOUNCE_E_HOOK, BOUNCE_E_BODY: BOUNCE_E_BODY, HANGER_INERTIA: HANGER_INERTIA,
      ROD_A: ROD_A, ROD_B: ROD_B, ROD_N_UP: ROD_N_UP, HAND: HAND,
      CATCH_MAX_SPEED: CATCH_MAX_SPEED, SLIP_THRESHOLD: SLIP_THRESHOLD,
      HOOK_LOOP_CENTER: HOOK_LOOP_CENTER, HOOK_LOOP_RADIUS: HOOK_LOOP_RADIUS,
      HOOK_TIP: HOOK_TIP, HOOK_BASE: HOOK_BASE, HOOK_TOP: HOOK_TOP,
      APEX: APEX, BODY_L: BODY_L, BODY_R: BODY_R,
      DESPAWN_MIN_X: DESPAWN_MIN_X, DESPAWN_MAX_X: DESPAWN_MAX_X, DESPAWN_MIN_Y: DESPAWN_MIN_Y
    }
  };
}
</script>
</body>
